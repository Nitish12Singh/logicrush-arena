services:
  - type: web
    name: logicrush-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: logicrush-db
          property: connectionString
      - key: CLIENT_URL
        sync: false

databases:
  - name: logicrush-db
    plan: free
    databaseName: logicrush
    user: logicrush
