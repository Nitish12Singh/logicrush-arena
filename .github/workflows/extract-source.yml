name: Extract source archive
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/extract-source.yml
      - logicrush-source.zip
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and publish project files
        run: |
          test -f logicrush-source.zip
          unzip -oq logicrush-source.zip -d .
          rm logicrush-source.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Publish LogicRush source files'
            git push
          fi
